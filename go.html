<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中...</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Microsoft Yahei,sans-serif;}
        body{height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7fa;color:#333;}
        .box{text-align:center;padding:40px;background:#fff;border-radius:12px;box-shadow:0 2px 15px #00000010;max-width:420px;display:none;}
        .tips{color:#666;margin-top:12px;font-size:14px;}
    </style>
</head>
<body>
    <div class="box" id="jumpBox">
        <h3>页面跳转中</h3>
        <p class="tips">正在为您前往目标地址...</p>
    </div>

    <script>
        const WHITELIST = [
            'baidu.com',
            'www.baidu.com'
        ];

        function isHostInWhitelist(host){
            host=(host||'').toLowerCase();
            if(!host)return false;
            return WHITELIST.some((w)=>{
                w=String(w).toLowerCase();
                if(!w)return false;
                if(w[0]==='*'){
                    const base=w.slice(1);
                    return host===base||host.endsWith('.'+base);
                }
                return host===w;
            });
        }

        const selfHost=location.host;
        const referrerHost=(()=>{
            if(!document.referrer)return '';
            try{return new URL(document.referrer).hostname.toLowerCase();}
            catch(e){return '';}
        })();

        function isInternal(targetUrl){
            try{
                const t=new URL(targetUrl);
                const th=t.hostname;
                const sh=selfHost.split(':')[0];
                if(t.host===selfHost)return true;
                if(th===sh)return true;
                if(th.endsWith('.'+sh))return true;
                if(sh.endsWith('.'+th))return true;
                return false;
            }catch(e){return false;}
        }

        let redirectDone=false;

        function go404(){
            if(redirectDone)return;
            redirectDone=true;
            document.title='404 - 页面未找到';
            setTimeout(function(){
                location.replace('/404.html');
            },300);
        }

        const showJumpBox=function(){document.getElementById('jumpBox').style.display='block';};

        function safeGo(targetUrl){
            try{
                const u=new URL(targetUrl);
                if(u.protocol!=='https:'&&u.protocol!=='http:'){go404();return;}
                if(!u.hostname){go404();return;}
                showJumpBox();
                redirectDone=true;
                location.replace(u.href);
            }catch(e){go404();}
        }

        const targetRaw=new URLSearchParams(location.search).get('url');
        const target=targetRaw?(targetRaw.trim()||''):'';

        if(target===''){
            go404();
        }
        else if(!/^https?:/i.test(target)){
            go404();
        }
        else{
            let targetUrl;
            try{
                targetUrl=new URL(target);
            }catch(e){
                go404();
            }
            if(targetUrl){
                if(targetUrl.protocol!=='http:'&&targetUrl.protocol!=='https:'){
                    go404();
                }
                else if(!targetUrl.hostname){
                    go404();
                }
                else if(isInternal(targetUrl)){
                    safeGo(targetUrl);
                }
                else if(referrerHost!==''&&isHostInWhitelist(referrerHost)){
                    safeGo(targetUrl);
                }
                else{
                    go404();
                }
            }
        }

        setTimeout(function(){
            if(!redirectDone){
                go404();
            }
        },3000);
    </script>
</body>
</html>
